const eventsContainer =

const allMarkers = [];

const bounds = [];

let totalEvents = 0;
let mappedEvents = 0;
let processedEvents = 0;


for (const day of itinerary) {
  totalEvents += day.events.length;
}


// ------------------------------------------------------
// ESCAPE HTML
// ------------------------------------------------------

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


// ------------------------------------------------------
// GEOCODING
// ------------------------------------------------------

async function geocode(address) {

  try {

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&limit=1" +
      "&q=" +
      encodeURIComponent(address);

    const response =
      await fetch(url, {
        headers: {
          "Accept-Language": "en"
        }
      });

    if (!response.ok) {
      return null;
    }

    const results =
      await response.json();

    if (!results.length) {
      return null;
    }

    return [
      parseFloat(results[0].lat),
      parseFloat(results[0].lon)
    ];

  } catch (error) {

    console.error(
      "Geocoding error:",
      error
    );

    return null;
  }
}


// ------------------------------------------------------
// WAIT BETWEEN GEOCODING REQUESTS
// ------------------------------------------------------

function wait(ms) {

  return new Promise(
    resolve => setTimeout(resolve, ms)
  );
}


// ------------------------------------------------------
// BUILD SIDEBAR
// ------------------------------------------------------

async function buildItinerary() {

  for (const day of itinerary) {

    const daySection =
      document.createElement("section");

    const dayHeader =
      document.createElement("div");

    dayHeader.className =
      "day-header";

    dayHeader.textContent =
      day.date;

    daySection.appendChild(
      dayHeader
    );


    for (const event of day.events) {

      const time =
        event[0];

      const name =
        event[1];

      const address =
        event[2];

      const pending =
        event[3];


      const eventElement =
        document.createElement("div");

      eventElement.className =
        "event";


      eventElement.innerHTML = `

        <div class="time">
          ${escapeHtml(time)}
        </div>

        <div class="name">

          ${escapeHtml(name)}

          ${
            pending
              ? '<span class="pending">Pending</span>'
              : ""
          }

        </div>

        <div class="address">
          ${escapeHtml(address)}
        </div>

      `;


      daySection.appendChild(
        eventElement
      );


      /*
       * Some itinerary entries are routes,
       * flights, or have no fixed address.
       */

      const cannotGeocode =
        address.includes("→") ||
        address.includes("✈") ||
        address === "No address supplied";


      if (!cannotGeocode) {

        await wait(1000);


        const searchAddress =
          address +
          (
            address.includes("New York") ||
            address.includes("Brooklyn")
              ? ""
              : ", New York, USA"
          );


        const coordinates =
          await geocode(
            searchAddress
          );


        if (coordinates) {

          const marker =
            L.marker(
              coordinates
            ).addTo(map);


          const popup = `

            <div class="popup-title">
              ${escapeHtml(name)}
            </div>

            <div class="popup-time">
              ${escapeHtml(time)}
            </div>

            <div class="popup-address">
              ${escapeHtml(address)}
            </div>

          `;


          marker.bindPopup(
            popup
          );


          allMarkers.push(
            marker
          );


          bounds.push(
            coordinates
          );


          mappedEvents++;


          eventElement.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(".event")
                .forEach(
                  el =>
                    el.classList.remove(
                      "active"
                    )
                );


              eventElement.classList.add(
                "active"
              );


              map.setView(
                coordinates,
                16,
                {
                  animate: true
                }
              );


              marker.openPopup();

            }
          );

        }

      }


      processedEvents++;


      status.textContent =
        `Mapa: ${mappedEvents} de ${totalEvents} puntos ubicados…`;

    }


    eventsContainer.appendChild(
      daySection
    );

  }


  if (bounds.length) {

    map.fitBounds(
      bounds,
      {
        padding: [30, 30]
      }
    );

  }


  status.textContent =
    `${mappedEvents} de ${totalEvents} puntos ubicados automáticamente.`;

}


buildItinerary();
