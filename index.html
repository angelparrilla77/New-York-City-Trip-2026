<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  background: #f4f4f4;
}

body {
  overflow: hidden;
}

/* ================================
   HEADER
================================ */

#header {
  height: 72px;
  background: #111;
  color: white;
  display: flex;
  align-items: center;
  padding: 10px 16px;
  position: relative;
  z-index: 2000;
}

#header-title {
  font-size: 20px;
  font-weight: 700;
}

#header-subtitle {
  font-size: 12px;
  opacity: 0.75;
  margin-top: 3px;
}

/* ================================
   DAY FILTERS
================================ */

#filters {
  height: 62px;
  background: white;
  border-bottom: 1px solid #ddd;

  display: flex;
  align-items: center;

  gap: 8px;
  padding: 8px 12px;

  overflow-x: auto;
  white-space: nowrap;

  position: relative;
  z-index: 1900;
}

.filter-button {
  flex: 0 0 auto;

  border: 1px solid #bbb;
  background: white;
  color: #222;

  border-radius: 20px;

  padding: 10px 16px;

  font-size: 13px;
  font-weight: 700;

  cursor: pointer;

  transition: 0.2s;
}

.filter-button:hover {
  background: #eee;
}

.filter-button.active {
  background: #111;
  color: white;
  border-color: #111;
}

/* ================================
   MAIN
================================ */

#main {
  height: calc(100vh - 134px);

  display: flex;

  position: relative;
}

#sidebar {
  width: 390px;
  min-width: 390px;

  background: white;

  overflow-y: auto;

  border-right: 1px solid #ddd;

  z-index: 1000;
}

#map {
  flex: 1;
  height: 100%;
}

/* ================================
   DAY SECTION
================================ */

.day-section {
  border-bottom: 1px solid #ddd;
}

.day-header {
  position: sticky;
  top: 0;

  z-index: 100;

  background: #111;
  color: white;

  padding: 12px 14px;

  font-weight: 700;
  font-size: 14px;
}

.day-header span {
  opacity: 0.7;

  font-weight: 500;

  margin-left: 6px;
}

/* ================================
   EVENT
================================ */

.event {
  padding: 12px 14px;

  border-bottom: 1px solid #eee;

  cursor: pointer;

  transition: background 0.15s;
}

.event:hover {
  background: #f6f6f6;
}

.event.selected {
  background: #eaeaea;
}

.event-time {
  font-size: 12px;

  font-weight: 700;

  color: #666;

  margin-bottom: 3px;
}

.event-name {
  font-size: 14px;

  font-weight: 700;

  color: #111;

  line-height: 1.3;
}

.event-address {
  font-size: 11px;

  color: #777;

  margin-top: 4px;

  line-height: 1.35;
}

.pending {
  color: #b26a00;

  font-weight: 700;
}

.no-location {
  color: #999;

  font-style: italic;
}

/* ================================
   MAP BUTTONS
================================ */

.map-buttons {
  display: flex;

  gap: 6px;

  margin-top: 9px;

  flex-wrap: wrap;
}

.map-button {
  display: inline-block;

  text-decoration: none;

  border-radius: 7px;

  padding: 7px 9px;

  font-size: 11px;

  font-weight: 700;

  border: 1px solid #ccc;

  background: white;

  color: #111;
}

.map-button:hover {
  background: #f0f0f0;
}

.apple-button {
  border-color: #111;
}

.google-button {
  border-color: #4285f4;
}

/* ================================
   POPUP
================================ */

.popup-title {
  font-size: 15px;

  font-weight: 700;

  margin-bottom: 5px;
}

.popup-time {
  font-size: 12px;

  color: #666;

  margin-bottom: 5px;
}

.popup-address {
  font-size: 12px;

  color: #555;

  line-height: 1.35;
}

.popup-pending {
  color: #b26a00;

  font-weight: 700;

  margin-top: 4px;
}

/* ================================
   LOADING
================================ */

#loading {
  position: absolute;

  top: 12px;
  right: 12px;

  z-index: 1500;

  background: rgba(255,255,255,0.95);

  padding: 8px 12px;

  border-radius: 8px;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.15);

  font-size: 12px;

  display: none;
}

/* ================================
   MOBILE
================================ */

@media (max-width: 800px) {

  #header {
    height: 64px;
  }

  #header-title {
    font-size: 17px;
  }

  #filters {
    height: 58px;
  }

  #map {

    min-height: 280px;
  }

  .day-header {
    position: sticky;
    top: 0;
  }

  .event {
    padding: 10px 13px;
  }

  .event-name {
    font-size: 13px;
  }

}

/* ================================
   LEAFLET
================================ */

.leaflet-popup-content {
  margin: 12px;

  min-width: 210px;

.leaflet-control-attribution {
  font-size: 9px;

function escapeHtml(text) {

  if (
    text === undefined ||
    text === null
  ) {
    return "";
  }

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ============================================================
   COORDINATE DETECTION
============================================================ */

function isCoordinateString(address) {

  return /^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/
    .test(address.trim());

}


function getCoordinates(address) {

  const parts =
    address.split(",");

  return [
    parseFloat(parts[0].trim()),
    parseFloat(parts[1].trim())
  ];

}


/* ============================================================
   APPLE MAPS
============================================================ */

function appleMapsUrl(address) {

  return (
    "https://maps.apple.com/?daddr=" +
    encodeURIComponent(address)
  );

}


/* ============================================================
   GOOGLE MAPS
============================================================ */

function googleMapsUrl(address) {

  return (
    "https://www.google.com/maps/dir/?api=1&destination=" +
    encodeURIComponent(address)
  );

}


/* ============================================================
   MAP BUTTONS
============================================================ */

function mapButtons(address) {

  if (
    !address ||
    address.trim() === ""
  ) {
    return "";
  }

  return `

    <div class="map-buttons">

      <a
        class="map-button apple-button"
        href="${appleMapsUrl(address)}"
        target="_blank"
        rel="noopener"
        onclick="event.stopPropagation();"
      >
         Apple Maps
      </a>

      <a
        class="map-button google-button"
        href="${googleMapsUrl(address)}"
        target="_blank"
        rel="noopener"
        onclick="event.stopPropagation();"
      >
        Google Maps
      </a>

    </div>

  `;

}


/* ============================================================
   SIDEBAR
============================================================ */

function renderSidebar() {

  itineraryContainer.innerHTML = "";

  const days = [

    {
      id: "sat",
      title: "Sábado, 21 de noviembre"
    },

    {
      id: "sun",
      title: "Domingo, 22 de noviembre"
    },

    {
      id: "mon",
      title: "Lunes, 23 de noviembre"
    },

    {
      id: "tue",
      title: "Martes, 24 de noviembre"
    }

  ];


  days.forEach(day => {

    if (
      currentDay !== "all" &&
      currentDay !== day.id
    ) {
      return;
    }


    const events =
      itinerary.filter(
        item => item.day === day.id
      );


    if (!events.length) {
      return;
    }


    const section =
      document.createElement("div");

    section.className =
      "day-section";


    const header =
      document.createElement("div");

    header.className =
      "day-header";

    header.innerHTML =
      escapeHtml(day.title) +
      "<span>2026</span>";

    section.appendChild(header);


    events.forEach(item => {

      const event =
        document.createElement("div");

      event.className =
        "event";


      const globalIndex =
        itinerary.indexOf(item);

      event.dataset.index =
        globalIndex;


      const pendingHtml =
        item.pending
          ? ' <span class="pending">(Pending)</span>'
          : "";


      let addressHtml = "";


      if (item.noMap) {

        addressHtml = `

          <div class="event-address no-location">

            ${escapeHtml(item.address)}

          </div>

        `;

      } else {

        addressHtml = `

          <div class="event-address">

            ${escapeHtml(item.address)}

          </div>

          ${mapButtons(item.address)}

        `;

      }


      event.innerHTML = `

        <div class="event-time">

          ${escapeHtml(item.time)}

        </div>

        <div class="event-name">

          ${escapeHtml(item.name)}

          ${pendingHtml}

        </div>

        ${addressHtml}

      `;


      event.addEventListener(
        "click",
        function(e) {

          if (
            e.target.closest("a")
          ) {
            return;
          }


          const markerRecord =
            markers.find(
              m => m.index === globalIndex
            );


          if (!markerRecord) {
            return;
          }


          map.setView(
            markerRecord.marker.getLatLng(),
            17,
            {
              animate: true
            }
          );


          markerRecord.marker.openPopup();


          document
            .querySelectorAll(".event")
            .forEach(el =>
              el.classList.remove(
                "selected"
              )
            );


          event.classList.add(
            "selected"
          );

        }
      );


      section.appendChild(event);

    });


    itineraryContainer.appendChild(section);

  });

}


/* ============================================================
   CREATE MARKER
============================================================ */

function createMarker(
  item,
  index,
  lat,
  lon
) {

  const popupPending =
    item.pending
      ? `
        <div class="popup-pending">
          Pending
        </div>
      `
      : "";


  const popup = `

    <div class="popup-title">

      ${escapeHtml(item.name)}

    </div>

    <div class="popup-time">

      ${escapeHtml(item.time)}

    </div>

    <div class="popup-address">

      ${escapeHtml(item.address)}

    </div>

    ${popupPending}

    ${mapButtons(item.address)}

  `;


  const marker =
    L.marker([lat, lon])
      .addTo(map)
      .bindPopup(popup);


  markers.push({

    index: index,

    day: item.day,

    marker: marker

  });

}


/* ============================================================
   GEOCODING
============================================================ */

async function geocodeAddress(address) {

  if (!address) {
    return null;
  }


  if (
    isCoordinateString(address)
  ) {

    return getCoordinates(address);

  }


  try {

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&limit=1" +
      "&q=" +
      encodeURIComponent(address);


    const response =
      await fetch(
        url,
        {
          headers: {
            "Accept":
              "application/json"
          }
        }
      );


    if (!response.ok) {
      return null;
    }


    const data =
      await response.json();


    if (
      !data ||
      !data.length
    ) {
      return null;
    }


    return [

      parseFloat(
        data[0].lat
      ),

      parseFloat(
        data[0].lon
      )

    ];

  } catch (error) {

    console.error(
      "Geocoding error:",
      address,
      error
    );

    return null;

  }

}


/* ============================================================
   LOAD ALL MARKERS
============================================================ */

async function loadMarkers() {

  loading.style.display =
    "block";


  const geocodable =
    itinerary.filter(
      item => !item.noMap
    );


  let completed = 0;


  for (
    let i = 0;
    i < itinerary.length;
    i++
  ) {

    const item =
      itinerary[i];


    if (item.noMap) {
      continue;
    }


    let coordinates = null;


    /*
      Use exact coordinates whenever
      they were explicitly provided.
    */

    if (item.coordinates) {

      coordinates =
        item.coordinates;

    } else {

      coordinates =
        await geocodeAddress(
          item.address
        );

    }


    if (coordinates) {

      createMarker(

        item,

        i,

        coordinates[0],

        coordinates[1]

      );

    }


    completed++;


    loading.innerHTML =
      "Cargando ubicaciones " +
      completed +
      " / " +
      geocodable.length;


    /*
      Delay between Nominatim
      requests.
    */

    if (!item.coordinates) {

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            1100
          )
      );

    }

  }


  loading.style.display =
    "none";


  applyFilter();

}


/* ============================================================
   APPLY FILTER
============================================================ */

function applyFilter() {

  const visibleMarkers = [];


  markers.forEach(
    record => {

      const shouldShow =
        currentDay === "all" ||
        record.day === currentDay;


      if (shouldShow) {

        record.marker.addTo(map);


        visibleMarkers.push(
          record.marker.getLatLng()
        );

      } else {

        map.removeLayer(
          record.marker
        );

      }

    }
  );


  renderSidebar();


  /*
    Automatically fit the
    selected day's locations.
  */

  if (
    visibleMarkers.length > 0
  ) {

    const bounds =
      L.latLngBounds(
        visibleMarkers
      );


    map.fitBounds(
      bounds,
      {
        padding: [35, 35],
        maxZoom: 15
      }
    );

  }

}


/* ============================================================
   FILTER BUTTONS
============================================================ */

document
  .querySelectorAll(
    ".filter-button"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      function() {

        document
          .querySelectorAll(
            ".filter-button"
          )
          .forEach(btn =>
            btn.classList.remove(
              "active"
            )
          );


        this.classList.add(
          "active"
        );


        currentDay =
          this.dataset.day;


        applyFilter();

      }
    );

  });


/* ============================================================
   INITIALIZE
============================================================ */

renderSidebar();

loadMarkers();

</script>

</body>
</html>
