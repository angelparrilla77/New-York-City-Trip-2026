<html lang="es">

  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<title>NYC Itinerary 2026</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
  background: #f4f4f4;
}

/* =========================
   HEADER
========================= */

#header {
  height: 72px;
  background: #111;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid #333;
}

.header-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .3px;
}

.header-subtitle {
  font-size: 12px;
  color: #aaa;
  margin-top: 3px;
}

/* =========================
   FILTERS
========================= */

#filters {
  height: 62px;
  background: white;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

#filters::-webkit-scrollbar {
  display: none;
}

.filter-button {
  flex: 0 0 auto;
  border: 1px solid #ccc;
  background: #f7f7f7;
  color: #222;
  border-radius: 22px;
  padding: 10px 17px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  min-height: 42px;
  -webkit-tap-highlight-color: transparent;
}

.filter-button.active {
  background: #111;
  color: white;
  border-color: #111;
}

/* =========================
   MAIN
========================= */

#main {
  width: 100%;
  height: calc(100vh - 134px);
  display: flex;
  position: relative;
}

/* =========================
   SIDEBAR
========================= */

#sidebar {
  width: 390px;
  min-width: 390px;
  height: 100%;
  background: #f5f5f5;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  border-right: 1px solid #d8d8d8;
}

#itinerary {
  padding: 12px;
}

.day-section {
  margin-bottom: 18px;
}

.day-header {
  position: sticky;
  top: 0;
  z-index: 5;
  background: #111;
  color: white;
  padding: 9px 11px;
  border-radius: 8px;
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .4px;
}

.event-card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  margin-bottom: 8px;
  padding: 11px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}

.event-time {
  font-size: 12px;
  color: #777;
  font-weight: 700;
  margin-bottom: 4px;
}

.event-name {
  font-size: 14px;
  font-weight: 800;
  color: #111;
  line-height: 1.25;
}

.event-address {
  font-size: 12px;
  color: #666;
  margin-top: 5px;
  line-height: 1.35;
}

.pending {
  display: inline-block;
  margin-left: 5px;
  padding: 2px 5px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 800;
  background: #fff1cc;
  color: #7a5500;
  vertical-align: middle;
}

.no-map-label {
  margin-top: 7px;
  font-size: 10px;
  color: #999;
  font-style: italic;
}

.map-buttons {
  display: flex;
  gap: 6px;
  margin-top: 9px;
}

.map-button {
  flex: 1;
  border: 0;
  border-radius: 7px;
  padding: 8px 5px;
  min-height: 34px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

.apple-button {
  background: #111;
  color: white;
}

.google-button {
  background: #eee;
  color: #111;
  border: 1px solid #ddd;
}

/* =========================
   MAP
========================= */

#map {
  flex: 1;
  height: 100%;
  min-width: 0;
}

.leaflet-container {
  background: #e8e8e8;
}

.leaflet-popup-content {
  margin: 12px;
}

.popup {
  min-width: 220px;
}

.popup-day {
  font-size: 10px;
  color: #777;
  font-weight: 700;
  margin-bottom: 3px;
}

.popup-time {
  font-size: 12px;
  color: #777;
  font-weight: 700;
  margin-bottom: 4px;
}

.popup-name {
  font-size: 15px;
  font-weight: 800;
  line-height: 1.25;
  margin-bottom: 5px;
}

.popup-address {
  font-size: 11px;
  color: #666;
  line-height: 1.35;
}

.popup .map-buttons {
  margin-top: 9px;
}

.popup .map-button {
  padding: 7px 4px;
}

/* =========================
   LOADING
========================= */

#loading {
  position: absolute;
  right: 18px;
  bottom: 18px;
  z-index: 1000;
  background: rgba(17,17,17,.9);
  color: white;
  padding: 9px 13px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}

#loading.hidden {
  display: none;
}

/* =========================
   LEAFLET
========================= */

.leaflet-control-attribution {
  font-size: 9px !important;
}

/* =========================
   MOBILE / IPHONE
========================= */

@media (max-width: 700px) {

  #header {
    height: 64px;
    padding:
      env(safe-area-inset-top)
      14px
      0
      14px;
  }

  .header-title {
    font-size: 18px;
  }

  .header-subtitle {
    font-size: 10px;
  }

  #filters {
    height: 58px;
    padding: 7px 9px;
  }

  .filter-button {
    padding: 8px 14px;
    min-height: 40px;
    font-size: 12px;
  }

  #main {
    height: calc(100vh - 122px);
    display: flex;
    flex-direction: row;
  }

  #sidebar {
    width: 43%;
    min-width: 43%;
  }

  #map {
    width: 57%;
    flex: 0 0 57%;
  }

  #itinerary {
    padding: 7px;
  }

  .day-header {
    font-size: 10px;
    padding: 7px;
    border-radius: 6px;
  }

  .event-card {
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 6px;
  }

  .event-time {
    font-size: 9px;
  }

  .event-name {
    font-size: 11px;
  }

  .event-address {
    font-size: 9px;
  }

  .map-buttons {
    flex-direction: column;
    gap: 4px;
  }

  .map-button {
    min-height: 28px;
    font-size: 9px;
    padding: 5px 3px;
  }

  .pending {
    font-size: 7px;
    padding: 1px 3px;
  }

  #loading {
    right: 8px;
    bottom: 8px;
    font-size: 9px;
    padding: 7px 9px;
  }
}

/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width: 390px) {

  #sidebar {
    width: 46%;
    min-width: 46%;
  }

  #map {
    width: 54%;
    flex: 0 0 54%;
  }

  .event-name {
    font-size: 10px;
  }

  .event-address {
    font-size: 8px;
  }

  .event-time {
    font-size: 8px;
  }
}

</style>

/* =========================================================
   DOM REFERENCES
========================================================= */

const itineraryContainer =
  document.getElementById("itinerary");

const loading =
  document.getElementById("loading");


/* =========================================================
   STATE
========================================================= */

let markers = [];

let currentDay = "all";


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   COORDINATE DETECTION
========================================================= */

function isCoordinateString(address) {

  if (!address) {
    return false;
  }

  return /^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/
    .test(address.trim());

}


/* =========================================================
   COORDINATES FROM STRING
========================================================= */

function coordinatesFromString(address) {

  const parts =
    address
      .split(",")
      .map(value => Number(value.trim()));

  if (
    parts.length === 2 &&
    Number.isFinite(parts[0]) &&
    Number.isFinite(parts[1])
  ) {
    return [
      parts[0],
      parts[1]
    ];
  }

  return null;

}


/* =========================================================
   APPLE MAPS
========================================================= */

function appleMapsUrl(address) {

  return (
    "https://maps.apple.com/?daddr=" +
    encodeURIComponent(address)
  );

}


/* =========================================================
   GOOGLE MAPS
========================================================= */

function googleMapsUrl(address) {

  return (
    "https://www.google.com/maps/dir/?api=1&destination=" +
    encodeURIComponent(address)
  );

}


/* =========================================================
   MAP BUTTONS
========================================================= */

function mapButtons(address) {

  return `
    <div class="map-buttons">

      <a
        class="map-button apple-button"
        href="${appleMapsUrl(address)}"
        target="_blank"
        rel="noopener"
      >
         Apple Maps
      </a>

      <a
        class="map-button google-button"
        href="${googleMapsUrl(address)}"
        target="_blank"
        rel="noopener"
      >
        Google Maps
      </a>

    </div>
  `;

}


/* =========================================================
   SIDEBAR
========================================================= */

function renderSidebar() {

  itineraryContainer.innerHTML = "";

  const visibleEvents =
    itinerary.filter(item =>
      currentDay === "all" ||
      item.day === currentDay
    );

  const groups = {};

  visibleEvents.forEach(item => {

    if (!groups[item.day]) {
      groups[item.day] = {
        dayName: item.dayName,
        events: []
      };
    }

    groups[item.day].events.push(item);

  });


  Object.keys(groups).forEach(day => {

    const section =
      document.createElement("section");

    section.className = "day-section";


    const header =
      document.createElement("div");

    header.className = "day-header";

    header.textContent =
      groups[day].dayName;


    section.appendChild(header);


    groups[day].events.forEach(item => {

      const card =
        document.createElement("div");

      card.className = "event-card";


      const pending =
        item.pending
          ? '<span class="pending">PENDING</span>'
          : "";


      let content = `

        <div class="event-time">
          ${escapeHtml(item.time)}
        </div>

        <div class="event-name">
          ${escapeHtml(item.name)}
          ${pending}
        </div>

        <div class="event-address">
          ${escapeHtml(item.address)}
        </div>

      `;


      if (item.noMap) {

        content += `
          <div class="no-map-label">
            Traslado / vuelo — sin punto en el mapa
          </div>
        `;

      } else {

        content += mapButtons(item.address);

      }


      card.innerHTML = content;

      section.appendChild(card);

    });


    itineraryContainer.appendChild(section);

  });

}


/* =========================================================
   MARKER
========================================================= */

function createMarker(
  item,
  index,
  lat,
  lon
) {

  const marker =
    L.marker([
      lat,
      lon
    ]);


  const pending =
    item.pending
      ? '<span class="pending">PENDING</span>'
      : "";


  const popupHtml = `

    <div class="popup">

      <div class="popup-day">
        ${escapeHtml(item.dayName)}
      </div>

      <div class="popup-time">
        ${escapeHtml(item.time)}
      </div>

      <div class="popup-name">
        ${escapeHtml(item.name)}
        ${pending}
      </div>

      <div class="popup-address">
        ${escapeHtml(item.address)}
      </div>

      ${mapButtons(item.address)}

    </div>

  `;


  marker.bindPopup(
    popupHtml,
    {
      maxWidth: 300,
      closeButton: true,
      autoPan: true
    }
  );


  marker.__eventIndex = index;

  markers.push(marker);

}


/* =========================================================
   NOMINATIM GEOCODING
========================================================= */

async function geocodeAddress(address) {

  const url =
    "https://nominatim.openstreetmap.org/search?" +
    new URLSearchParams({
      q: address,
      format: "json",
      limit: "1"
    });


  try {

    const response =
      await fetch(
        url,
        {
          headers: {
            "Accept":
              "application/json"
          }
        }
      );


    if (!response.ok) {
      return null;
    }


    const data =
      await response.json();


    if (
      Array.isArray(data) &&
      data.length > 0
    ) {

      const lat =
        Number(data[0].lat);

      const lon =
        Number(data[0].lon);


      if (
        Number.isFinite(lat) &&
        Number.isFinite(lon)
      ) {

        return [
          lat,
          lon
        ];

      }

    }

  } catch (error) {

    console.warn(
      "Geocoding error:",
      address,
      error
    );

  }


  return null;

}


/* =========================================================
   LOAD MARKERS
========================================================= */

async function loadMarkers() {

  loading.classList.remove("hidden");


  for (
    let i = 0;
    i < itinerary.length;
    i++
  ) {

    const item =
      itinerary[i];


    if (item.noMap) {
      continue;
    }


    let coordinates =
      null;


    /* -----------------------------------------
       1. EXPLICIT COORDINATES
    ----------------------------------------- */

    if (
      Array.isArray(item.coordinates) &&
      item.coordinates.length === 2
    ) {

      coordinates =
        item.coordinates;

    }


    /* -----------------------------------------
       2. COORDINATES INSIDE ADDRESS
    ----------------------------------------- */

    else if (
      isCoordinateString(item.address)
    ) {

      coordinates =
        coordinatesFromString(
          item.address
        );

    }


    /* -----------------------------------------
       3. NOMINATIM
    ----------------------------------------- */

    else {

      coordinates =
        await geocodeAddress(
          item.address
        );


      /*
       Nominatim usage policy:
       keep requests separated.
      */

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            1100
          )
      );

    }


    if (coordinates) {

      createMarker(
        item,
        i,
        coordinates[0],
        coordinates[1]
      );

    }

  }


  loading.classList.add("hidden");


  applyFilter();

}


/* =========================================================
   APPLY FILTER
========================================================= */

function applyFilter() {

  const visibleMarkers = [];


  markers.forEach(marker => {

    const item =
      itinerary[
        marker.__eventIndex
      ];


    const visible =
      currentDay === "all" ||
      item.day === currentDay;


    if (visible) {

      if (!map.hasLayer(marker)) {
        marker.addTo(map);
      }

      visibleMarkers.push(marker);

    } else {

      if (map.hasLayer(marker)) {
        map.removeLayer(marker);
      }

    }

  });


  renderSidebar();


  /*
   Automatically fit the map to
   all visible points.
  */

  if (
    visibleMarkers.length > 0
  ) {

    const bounds =
      L.latLngBounds(
        visibleMarkers.map(
          marker =>
            marker.getLatLng()
        )
      );


    map.fitBounds(
      bounds,
      {
        paddingTopLeft: [20, 20],
        paddingBottomRight: [20, 20],
        maxZoom:
          currentDay === "all"
            ? 13
            : 15,
        animate: true
      }
    );

  }

}


/* =========================================================
   FILTER BUTTONS
========================================================= */

document
  .querySelectorAll(".filter-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      function() {

        document
          .querySelectorAll(".filter-button")
          .forEach(btn =>
            btn.classList.remove("active")
          );


        this.classList.add("active");


        currentDay =
          this.dataset.day;


        applyFilter();

      }
    );

  });

========================================================= */

/* =========================================================

========================================================= */
